const X=(en,ar)=>L=="ar"?(ar||en):L=="am"?(AM[en]||en):en;

({home:home,login:login,market:market,post:post,orders:orders,order:()=>order(id),notes:notes,profile:profile,admin:admin}[h]||home)()}catch(e){}}

function login(){const tgOn=window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData,ar=L=="ar";$("#v").innerHTML=`<div class="card auth"><h2>${T("login")}</h2>${tgOn?`<button class=p style="width:100%;margin-bottom:10px" onclick="tgLogin()">Telegram</button>`:""}<div id=gbtn style="margin-bottom:10px"></div><button style="width:100%" onclick="pkLogin()">🔐 ${X("Sign in with a Passkey","الدخول بمفتاح المرور (Passkey)")}</button><details style="margin-top:14px"><summary class=mu>${X("Existing account","حساب قديم (اسم مستخدم)")}</summary><input id=u placeholder="${T("user")}" autocomplete=username><input id=p type=password placeholder="${T("pw")}" autocomplete=current-password><button class=p style="width:100%" onclick="auth('login')">${T("login")}</button></details></div>`;gInit()}

const b64=b=>{let s="";new Uint8Array(b).forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
const unb=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");s+="=".repeat((4-s.length%4)%4);return Uint8Array.from(atob(s),c=>c.charCodeAt(0)).buffer};
function pkErr(e){toast(e.name=="NotAllowedError"?(X("Cancelled","أُلغيت العملية")):"Passkey: "+(e.name||"error"))}
async function pkCreate(){if(!window.PublicKeyCredential)return toast(X("Passkeys are not supported in this browser"));
const {options:o,challenge_id}=await api("passkeys/register/options","POST",{});o.challenge=unb(o.challenge);o.user.id=unb(o.user.id);(o.excludeCredentials||[]).forEach(x=>x.id=unb(x.id));

async function pkList(){const d=await api("passkeys"),ar=L=="ar";$("#pks").innerHTML=`<div class=row><b>🔐 ${X("Passkeys","مفاتيح المرور")}</b><button class=p onclick="pkCreate()">${X("Create a Passkey","إنشاء مفتاح مرور")}</button></div>`+(d.passkeys.map(p=>`<div class=row style="margin-top:10px;border-top:1px solid var(--bd);padding-top:10px"><div><b>${E(p.name)}</b><div class=mu>${E((p.device||"").slice(0,70))}</div><div class=mu>${new Date(p.created*1e3).toLocaleDateString()}${p.last_used?" · "+new Date(p.last_used*1e3).toLocaleDateString():""}</div></div><button class=r onclick="pkDel(${p.id})">${X("Delete","حذف")}</button></div>`).join("")||`<p class=mu>${T("none")}</p>`)}
async function pkDel(i){if(!confirm(X("Delete this passkey?","حذف مفتاح المرور هذا؟")))return;await api(`passkeys/${i}/delete`,"POST",{});await load();pkList()}
function pkBanner(){return window.PublicKeyCredential&&ME.passkeys==0?`<div class="card row"><span>🔐 ${X("Secure your account and sign in with your fingerprint, face or screen lock","أمّن حسابك وادخل بسرعة ببصمتك أو قفل الشاشة")}</span><button class=p onclick="pkCreate()">${X("Create a Passkey","إنشاء مفتاح مرور")}</button></div>`:""}
async function auth(a){const d=await api(a,"POST",{username:$("#u").value,password:$("#p").value});localStorage.tok=d.token;await load();go("market")}
let side="sell";
async function market(){const d=await api("ads?side="+side);$("#v").innerHTML=pkBanner()+`<div class=row style="margin-bottom:14px"><div class=tabs><button class="b ${side=="sell"?"on":""}" onclick="side='sell';market()">${T("buy")}</button><button class="s ${side=="buy"?"on":""}" onclick="side='buy';market()">${T("sell")}</button></div><span class=mu>${T("bal")}: <b style="color:var(--ac)">${ME.user.balance} USDT</b></span></div><div class=tbl><div class="ad th"><span>Merchant</span><span>${T("price")}</span><span>${T("avail")} / ${T("limit")}</span><span>${T("pay")}</span><span>${T("amt")}</span></div>`+(d.ads.map(a=>`<div class=ad><div><span class=av>${E(a.username[0]).toUpperCase()}</span><b>${E(a.username)}</b><div class=mu>★${(+a.rating).toFixed(1)} · ${a.trades}</div></div><div class=pr>${a.price} <small class=mu>${E(a.fiat)}</small></div><div><div>${a.remaining} USDT</div><div class=mu>${a.min_amt} - ${a.max_amt}</div></div><div><span class=tag>${E(a.method)}</span></div><div class=row style="flex-wrap:nowrap"><input id="a${a.id}" type=number step=any placeholder="USDT"><button class="${side=="sell"?"g":"r"}" onclick="trade(${a.id})">${T("go")}</button></div></div>`).join("")||`<p class=mu style="padding:20px">${T("none")}</p>`)+`</div>`}
async function trade(id){const d=await api("orders","POST",{ad_id:id,amount:$("#a"+id).value});await load();go("order/"+d.id)}
function post(){$("#v").innerHTML=`<div class=card><select id=s><option value=sell>${T("sell")}</option><option value=buy>${T("buy")}</option></select><div class=grid><input id=pr type=number step=any placeholder="${T("price")}"><input id=fi value=ETB><input id=am type=number step=any placeholder="${T("amt")}"><input id=mn type=number step=any placeholder="${T("min")}"><input id=mx type=number step=any placeholder="${T("max")}"><input id=me placeholder="${T("meth")}"></div><button class=p onclick="mk()">${T("post")}</button></div><div id=my></div>`;myads()}
async function mk(){await api("ads","POST",{side:$("#s").value,price:$("#pr").value,fiat:$("#fi").value,amount:$("#am").value,min:$("#mn").value,max:$("#mx").value,method:$("#me").value});await load();post()}
async function myads(){const d=await api("my/ads");$("#my").innerHTML=`<h3>${T("mine")}</h3>`+d.ads.map(a=>`<div class="card row"><span>${a.side} ${a.remaining} @ ${a.price} ${E(a.fiat)} <span class="tag s-${a.status}">${a.status}</span></span>${a.status=="open"?`<button onclick="cl(${a.id})">${T("close")}</button>`:""}</div>`).join("")}
async function cl(i){await api(`ads/${i}/close`,"POST");await load();post()}
async function orders(){const d=await api("orders");$("#v").innerHTML=d.orders.map(o=>`<div class="card row" onclick="go('order/${o.id}')" style="cursor:pointer"><span>#${o.id} ${o.amount} USDT @ ${o.price} ${E(o.fiat)}</span><span class=mu>${E(o.buyer)} → ${E(o.seller)}</span><span class="tag s-${o.status}">${o.status}</span></div>`).join("")||`<p class=mu>${T("none")}</p>`}
async function order(id){const d=await api("orders/"+id),o=d.order,b=d.me==o.buyer_id,s=d.me==o.seller_id;
const B=[];if(b&&o.status=="pending")B.push(`<button class=g onclick="ac('paid')">${T("paid")}</button><button onclick="ac('cancel')">${T("can")}</button>`);if(s&&o.status=="paid")B.push(`<button class=g onclick="ac('release')">${T("rel")}</button>`);if(o.status=="paid")B.push(`<button class=r onclick="ac('dispute')">${T("dis")}</button>`);
if(o.status=="completed"&&!d.rated)B.push(`<input id=sc type=number min=1 max=5 placeholder="${T("rate")}" style="max-width:120px"><button onclick="rt()">★</button>`);
$("#v").innerHTML=`<div class=card><div class=row><b>#${o.id} ${o.amount} USDT = ${(o.amount*o.price).toFixed(2)} ${E(o.fiat)}</b><span class="tag s-${o.status}">${o.status}</span></div><p class=mu>${E(o.buyer)} → ${E(o.seller)} · ${E(o.method)}</p><div class=row>${B.join("")}</div></div><div class=card id=ch>${d.messages.map(m=>`<div class="bub ${m.username==ME.user.username?"me":""}"><small>${E(m.username)}</small>${E(m.body)}</div>`).join("")}<div class=row><input id=cm placeholder="${T("msg")}" style="flex:1"><button class=p onclick="sd()">${T("send")}</button></div></div>`;
window.OID=id;timer=setInterval(async()=>{if(document.activeElement&&document.activeElement.id=="cm"&&$("#cm").value)return;if((location.hash.split("/")[0])=="#order")order(id)},6000)}
async function ac(a){let r=a=="dispute"?prompt("Reason")||"":"";await api(`orders/${OID}/${a}`,"POST",{reason:r});await load();order(OID)}
async function sd(){const v=$("#cm").value;if(!v)return;await api(`orders/${OID}/chat`,"POST",{body:v});order(OID)}
async function rt(){await api(`orders/${OID}/rate`,"POST",{score:$("#sc").value});order(OID)}
async function notes(){const d=await api("notifications");await load();nav();$("#v").innerHTML=d.notifications.map(n=>`<div class=card>${E(n.body)}<div class=mu>${new Date(n.created*1e3).toLocaleString()}</div></div>`).join("")||`<p class=mu>${T("none")}</p>`}
async function profile(){await load();const u=ME.user;$("#v").innerHTML=`<div class=card><h2><span class=av>${E(u.username[0]).toUpperCase()}</span>${E(u.username)} <span class=tag>${u.role}</span></h2><p class=mu>${T("bal")}</p><div class=bal>${u.balance} <small>USDT</small></div><p>★ ${ME.rating.avg} (${ME.rating.count})</p><button onclick="lo()">${T("out")}</button></div><div class=card id=pks></div><h3>${T("led")}</h3>`+ME.ledger.map(l=>`<div class="card row"><span>${E(l.kind)}</span><b style="color:var(${l.amount>0?"--g":"--r"})">${l.amount}</b></div>`).join("");pkList()}
async function lo(){try{await api("logout","POST")}catch(e){}localStorage.removeItem("tok");ME=null;go("home")}
let at="ov",AD=null;
async function admin(){AD=await api("admin/overview");adr()}
function adr(){const d=AD,s=d.stats,tb=[["ov",X("Overview")],["dp",X("Disputes")+" ("+s.open_disputes+")"],["or",X("Orders")],["us",X("Users")],["ad",X("Ads")],["au",X("Audit")]];
let h=`<h2 style="margin-top:0">🛡️ ${T("admin")}</h2><div class=tabs style="overflow:auto;max-width:100%">${tb.map(([k,n])=>`<button class="${at==k?"on b":""}" onclick="at='${k}';adr()">${n}</button>`).join("")}</div><br><br>`;
const st=x=>`<span class="tag s-${x}">${x}</span>`;
if(at=="ov")h+=`<div class=stats>${[[X("Users"),s.users],[X("Banned"),s.banned],[X("Orders"),s.orders],[X("Completed"),s.completed],[X("Volume (USDT)"),(+s.volume).toFixed(2)],[X("Open ads"),s.open_ads],[X("Open disputes"),s.open_disputes],[X("Total demo balance"),(+s.total_balance).toFixed(2)]].map(([k,v])=>`<div class=card><b>${v}</b><span class=mu>${k}</span></div>`).join("")}</div>`;
if(at=="dp")h+=d.disputes.map(x=>`<div class=card><div class=row><span>${X("Dispute")} #${x.id} · order #${x.order_id} ${st(x.status=="open"?"disputed":"completed")} ${x.status}${x.resolution?" → "+x.resolution:""}</span><span><button onclick="adv(${x.order_id},'dd${x.id}')">${X("View")}</button> ${x.status=="open"?`<button class=g onclick="rs(${x.id},'release')">${T("res")}</button> <button class=r onclick="rs(${x.id},'refund')">${T("ref")}</button>`:""}</span></div><div class=mu>${E(x.reason)}</div><div id=dd${x.id}></div></div>`).join("")||`<p class=mu>${T("none")}</p>`;
if(at=="or")h+=d.orders.map(o=>`<div class=card><div class=row><span>#${o.id} ${o.amount} USDT @ ${o.price} ${E(o.fiat)} · ${E(o.buyer)} → ${E(o.seller)}</span><span>${st(o.status)} <button onclick="adv(${o.id},'od${o.id}')">${X("View")}</button></span></div><div id=od${o.id}></div></div>`).join("");
if(at=="us")h+=`<input placeholder="${X("Search username")}" oninput="const v=this.value.toLowerCase();document.querySelectorAll('.ur').forEach(e=>e.style.display=e.dataset.n.includes(v)?'':'none')">`+d.users.map(x=>`<div class="card row ur" data-n="${E(x.username.toLowerCase())}"><span>#${x.id} <b>${E(x.username)}</b> <span class=tag>${x.role}</span> ${x.balance} USDT ${x.banned?"🚫":""}</span><span><button onclick="bn(${x.id})">${T("ban")}</button> <button onclick="rl(${x.id})">${X("Role")}</button></span></div>`).join("");
if(at=="ad")h+=d.ads.map(a=>`<div class="card row"><span>#${a.id} ${E(a.username)} · ${a.side} ${a.remaining} @ ${a.price} ${E(a.fiat)} ${st(a.status=="open"?"pending":"cancelled")}${a.status}</span>${a.status=="open"?`<button class=r onclick="ac2(${a.id})">${T("close")}</button>`:""}</div>`).join("");
if(at=="au")h+=d.audit.map(x=>`<div class=mu>${new Date(x.created*1e3).toLocaleString()} · #${x.user_id} ${E(x.action)} ${E(x.detail)} ${E(x.ip)}</div>`).join("");
$("#v").innerHTML=h}
async function adv(oid,cid){const d=await api("admin/orders/"+oid);$("#"+cid).innerHTML=`<div style="margin-top:8px">${d.messages.map(m=>`<div class=bub><small>${E(m.username)}</small>${E(m.body)}</div>`).join("")||`<span class=mu>${T("none")}</span>`}</div>`}
async function rl(i){if(confirm("Change this user's role?")){await api(`admin/users/${i}/role`,"POST",{});admin()}}
async function ac2(i){if(confirm("Close this ad and unlock the seller's USDT?")){await api(`admin/ads/${i}/close`,"POST",{});admin()}}
async function rs(i,d){if(!confirm("Confirm: "+d+"?"))return;await api(`admin/disputes/${i}/resolve`,"POST",{decision:d});admin()}
async function bn(i){await api(`admin/users/${i}/ban`,"POST");admin()}
window.onhashchange=route;init();
</script></body></html>
