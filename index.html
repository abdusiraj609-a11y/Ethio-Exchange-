<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>P2P Exchange</title>
<style>
:root{--bg:#0b0e11;--bg2:#181a20;--card:#1e2329;--bd:#2b3139;--tx:#eaecef;--mu:#848e9c;--ac:#fcd535;--g:#0ecb81;--r:#f6465d;--sh:0 8px 30px rgba(0,0,0,.35)}
:root[data-t=light]{--bg:#fafafa;--bg2:#f5f5f5;--card:#fff;--bd:#eaecef;--tx:#1e2329;--mu:#707a8a;--sh:0 8px 30px rgba(0,0,0,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Inter","Segoe UI",system-ui,"Noto Sans Arabic",sans-serif;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;gap:10px;padding:0 20px;height:60px;background:var(--bg2);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:.5px;cursor:pointer;margin-inline-end:auto;color:var(--tx)}
.logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#fcd535,#f0b90b);display:grid;place-items:center;color:#1e2329;font-style:normal;font-size:16px}
#nav{display:flex;gap:2px}.nb{background:none;border:0;color:var(--mu);padding:18px 12px;border-radius:0;border-bottom:2px solid transparent;font-weight:500}
.nb:hover,.nb.on{color:var(--tx)}.nb.on{border-bottom-color:var(--ac)}
button,input,select{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:9px 14px;transition:.15s;outline:0}
input:focus,select:focus{border-color:var(--ac)}button{cursor:pointer}button:hover{filter:brightness(1.12);transform:translateY(-1px)}
button.p{background:var(--ac);color:#181a20;border:0;font-weight:700}button.g{background:var(--g);color:#fff;border:0;font-weight:600}button.r{background:var(--r);color:#fff;border:0;font-weight:600}
.ib{width:36px;height:36px;padding:0;border-radius:50%;display:grid;place-items:center}
main{max-width:1100px;margin:22px auto;padding:0 16px;animation:f .3s}@keyframes f{from{opacity:0;transform:translateY(8px)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}.mu{color:var(--mu);font-size:13px}
input,select{width:100%;margin:4px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.hero{padding:70px 20px 50px;text-align:start;border-radius:20px;background:radial-gradient(circle at 80% 0,rgba(252,213,53,.18),transparent 50%),var(--card);border:1px solid var(--bd);margin-bottom:16px}
.hero h1{font-size:clamp(30px,5vw,52px);line-height:1.15;margin:0 0 12px;max-width:640px}.hero h1 em{font-style:normal;color:var(--ac)}.hero p{max-width:520px;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}.stats .card{text-align:center}.stats b{display:block;font-size:24px;color:var(--ac)}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.feat .card:hover{border-color:var(--ac);box-shadow:var(--sh)}.feat span{font-size:28px}
.tabs{display:inline-flex;background:var(--bg2);border-radius:10px;padding:4px;border:1px solid var(--bd)}.tabs button{border:0;background:none;padding:8px 22px;font-weight:600;color:var(--mu)}.tabs button.on.b{background:var(--g);color:#fff}.tabs button.on.s{background:var(--r);color:#fff}
.ad{display:grid;grid-template-columns:1.4fr 1fr 1.2fr 1fr 1.4fr;gap:12px;align-items:center;padding:16px;border-bottom:1px solid var(--bd)}.ad:hover{background:var(--bg2)}
.th{color:var(--mu);font-size:12px;padding:10px 16px;background:var(--bg2);border-radius:10px 10px 0 0}.tbl{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.av{width:34px;height:34px;border-radius:50%;background:var(--ac);color:#181a20;display:inline-grid;place-items:center;font-weight:800;margin-inline-end:8px;vertical-align:middle}
.pr{font-size:20px;font-weight:700}.tag{padding:2px 9px;border-radius:6px;background:var(--bd);font-size:12px;font-weight:600}
.s-pending{background:rgba(252,213,53,.15);color:var(--ac)}.s-paid{background:rgba(14,203,129,.15);color:var(--g)}.s-completed{background:var(--g);color:#fff}.s-cancelled{background:var(--bd);color:var(--mu)}.s-disputed{background:var(--r);color:#fff}
.bub{max-width:75%;padding:8px 12px;margin:6px 0;border-radius:12px;background:var(--bg2);word-break:break-word}.bub.me{margin-inline-start:auto;background:var(--ac);color:#181a20}.bub small{display:block;opacity:.6;font-size:11px}
.auth{max-width:400px;margin:40px auto}.auth h2{margin-top:0}.bal{background:linear-gradient(135deg,var(--card),var(--bg2));font-size:28px;font-weight:800}
#toast{position:fixed;top:70px;inset-inline:16px;text-align:center;z-index:50;pointer-events:none}#toast div{display:inline-block;background:var(--r);color:#fff;padding:10px 18px;border-radius:10px;box-shadow:var(--sh)}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}
@media(max-width:760px){#nav{position:fixed;bottom:0;inset-inline:0;background:var(--bg2);border-top:1px solid var(--bd);justify-content:space-around;z-index:30}.nb{padding:12px 6px;font-size:12px;border:0}.nb.on{color:var(--ac)}main{padding-bottom:80px}header{padding:0 12px}
.ad{grid-template-columns:1fr 1fr}.th{display:none}.hero{padding:40px 16px}}
</style></head><body>
<header><div class=logo onclick="go('home')"><i>◆</i>P2P</div><span id="nav"></span><button class=ib onclick="tg('t')" id="bt">☾</button><button class=ib onclick="tg('l')" style="font-size:12px">EN/ع</button></header>
<main id="v"></main><div id="toast"></div>
<script>
const I={en:{market:"Market",buy:"Buy USDT",sell:"Sell USDT",post:"Post Ad",orders:"Orders",notes:"Notifications",profile:"Profile",admin:"Admin",login:"Login",reg:"Register",out:"Logout",user:"Username",pw:"Password",hero:"Trade USDT peer-to-peer",sub:"Demo platform: simulated escrow, no real money.",price:"Price",avail:"Available",limit:"Limit",pay:"Payment",go:"Trade",amt:"Amount (USDT)",min:"Min",max:"Max",meth:"Payment method",bal:"Demo balance",paid:"I have paid",rel:"Release USDT",can:"Cancel",dis:"Dispute",send:"Send",msg:"Message",rate:"Rate (1-5)",mine:"My ads",close:"Close",none:"Nothing here",res:"Release",ref:"Refund",ban:"Ban/Unban",led:"Ledger"},
ar:{market:"السوق",buy:"شراء USDT",sell:"بيع USDT",post:"إنشاء إعلان",orders:"الطلبات",notes:"الإشعارات",profile:"الحساب",admin:"الإدارة",login:"دخول",reg:"تسجيل",out:"خروج",user:"اسم المستخدم",pw:"كلمة المرور",hero:"تداول USDT بين الأفراد",sub:"منصة تجريبية: ضمان محاكى بدون أموال حقيقية.",price:"السعر",avail:"المتاح",limit:"الحدود",pay:"الدفع",go:"تداول",amt:"الكمية (USDT)",min:"الأدنى",max:"الأقصى",meth:"طريقة الدفع",bal:"الرصيد التجريبي",paid:"قمت بالدفع",rel:"تحرير USDT",can:"إلغاء",dis:"نزاع",send:"إرسال",msg:"رسالة",rate:"قيّم (1-5)",mine:"إعلاناتي",close:"إغلاق",none:"لا يوجد شيء",res:"تحرير",ref:"استرداد",ban:"حظر/فك",led:"السجل"}};
const API_BASE="https://server-dqtp.onrender.com"; // <-- set to your backend URL (no trailing slash)
let L=localStorage.lang||"en",ME=null,timer;const T=k=>I[L][k]||k,$=s=>document.querySelector(s);
const E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function tg(w){if(w=="l"){L=L=="en"?"ar":"en";localStorage.lang=L}else{localStorage.th=localStorage.th=="light"?"dark":"light"}ap();route()}
function ap(){document.documentElement.lang=L;document.documentElement.dir=L=="ar"?"rtl":"ltr";document.documentElement.dataset.t=localStorage.th||"dark";$("#bt").textContent=(localStorage.th=="light")?"☾":"☀"}
function toast(m){$("#toast").innerHTML=`<div>${E(m)}</div>`;setTimeout(()=>$("#toast").innerHTML="",3500)}
async function api(p,m="GET",b){const r=await fetch(API_BASE+"/api/"+p,{method:m,headers:{"Content-Type":"application/json",...(localStorage.tok?{Authorization:"Bearer "+localStorage.tok}:{})},body:b?JSON.stringify(b):undefined}).catch(()=>{toast("Cannot reach server");throw{}});if(r.status==401&&localStorage.tok){localStorage.removeItem("tok");ME=null}const d=await r.json().catch(()=>({}));if(!r.ok){toast(d.error||"error");throw d}return d}
async function init(){ap();try{if(localStorage.tok)await load()}catch(e){ME=null}route()}
async function load(){ME=await api("me")}
function nav(){const a=ME?[["market","market"],["post","post"],["orders","orders"],["notes","notes"],["profile","profile"]]:[["login","login"]];if(ME&&ME.user.role=="admin")a.push(["admin","admin"]);
const cur=(location.hash.slice(1)||"home").split("/")[0];$("#nav").innerHTML=a.map(([h,k])=>`<button class="nb ${cur==h?"on":""}" onclick="go('${h}')">${T(k)}${k=="notes"&&ME.unread?" ("+ME.unread+")":""}</button>`).join("")}
function go(h){location.hash=h;route()}
async function route(){clearInterval(timer);nav();const [h,id]=(location.hash.slice(1)||"home").split("/");const v=$("#v");
try{if(!ME&&!["home","login"].includes(h))return go("login");
({home:home,login:login,market:market,post:post,orders:orders,order:()=>order(id),notes:notes,profile:profile,admin:admin}[h]||home)()}catch(e){}}
function home(){const t=L=="ar"?["ضمان محاكى","بدون عمولات","دعم عربي"]:["Simulated escrow","Zero fees","Arabic & English"];$("#v").innerHTML=`<div class=hero><h1>${L=="ar"?'تداول <em>USDT</em> بين الأفراد بأمان':'Trade <em>USDT</em> peer-to-peer, securely'}</h1><p class=mu>${T("sub")}</p><button class=p style="padding:14px 34px;font-size:16px" onclick="go('${ME?"market":"login"}')">${ME?T("market"):T("reg")}</button></div><div class=stats><div class=card><b>USDT</b><span class=mu>P2P</span></div><div class=card><b>0%</b><span class=mu>${t[1]}</span></div><div class=card><b>24/7</b><span class=mu>Support</span></div><div class=card><b>2</b><span class=mu>${t[2]}</span></div></div><div class=feat><div class=card><span>🔒</span><h3>${t[0]}</h3><p class=mu>${T("sub")}</p></div><div class=card><span>⚡</span><h3>${L=="ar"?"سريع":"Fast"}</h3><p class=mu>${L=="ar"?"أنشئ إعلاناً وابدأ التداول فوراً.":"Post an ad and start trading instantly."}</p></div><div class=card><span>🛡️</span><h3>${L=="ar"?"حماية النزاعات":"Dispute protection"}</h3><p class=mu>${L=="ar"?"فريق إدارة يحل النزاعات.":"Admins resolve disputes fairly."}</p></div></div>`}
function login(){$("#v").innerHTML=`<div class="card auth"><h2>${T("login")} / ${T("reg")}</h2><input id=u placeholder="${T("user")}" autocomplete=username><input id=p type=password placeholder="${T("pw")}" autocomplete=current-password><div class=row style="margin-top:10px"><button class=p style="flex:1" onclick="auth('login')">${T("login")}</button><button style="flex:1" onclick="auth('register')">${T("reg")}</button></div></div>`}
async function auth(a){const d=await api(a,"POST",{username:$("#u").value,password:$("#p").value});localStorage.tok=d.token;await load();go("market")}
let side="sell";
async function market(){const d=await api("ads?side="+side);$("#v").innerHTML=`<div class=row style="margin-bottom:14px"><div class=tabs><button class="b ${side=="sell"?"on":""}" onclick="side='sell';market()">${T("buy")}</button><button class="s ${side=="buy"?"on":""}" onclick="side='buy';market()">${T("sell")}</button></div><span class=mu>${T("bal")}: <b style="color:var(--ac)">${ME.user.balance} USDT</b></span></div><div class=tbl><div class="ad th"><span>Merchant</span><span>${T("price")}</span><span>${T("avail")} / ${T("limit")}</span><span>${T("pay")}</span><span>${T("amt")}</span></div>`+(d.ads.map(a=>`<div class=ad><div><span class=av>${E(a.username[0]).toUpperCase()}</span><b>${E(a.username)}</b><div class=mu>★${(+a.rating).toFixed(1)} · ${a.trades}</div></div><div class=pr>${a.price} <small class=mu>${E(a.fiat)}</small></div><div><div>${a.remaining} USDT</div><div class=mu>${a.min_amt} - ${a.max_amt}</div></div><div><span class=tag>${E(a.method)}</span></div><div class=row style="flex-wrap:nowrap"><input id="a${a.id}" type=number step=any placeholder="USDT"><button class="${side=="sell"?"g":"r"}" onclick="trade(${a.id})">${T("go")}</button></div></div>`).join("")||`<p class=mu style="padding:20px">${T("none")}</p>`)+`</div>`}
async function trade(id){const d=await api("orders","POST",{ad_id:id,amount:$("#a"+id).value});await load();go("order/"+d.id)}
function post(){$("#v").innerHTML=`<div class=card><select id=s><option value=sell>${T("sell")}</option><option value=buy>${T("buy")}</option></select><div class=grid><input id=pr type=number step=any placeholder="${T("price")}"><input id=fi value=ETB><input id=am type=number step=any placeholder="${T("amt")}"><input id=mn type=number step=any placeholder="${T("min")}"><input id=mx type=number step=any placeholder="${T("max")}"><input id=me placeholder="${T("meth")}"></div><button class=p onclick="mk()">${T("post")}</button></div><div id=my></div>`;myads()}
async function mk(){await api("ads","POST",{side:$("#s").value,price:$("#pr").value,fiat:$("#fi").value,amount:$("#am").value,min:$("#mn").value,max:$("#mx").value,method:$("#me").value});await load();post()}
async function myads(){const d=await api("my/ads");$("#my").innerHTML=`<h3>${T("mine")}</h3>`+d.ads.map(a=>`<div class="card row"><span>${a.side} ${a.remaining} @ ${a.price} ${E(a.fiat)} <span class="tag s-${a.status}">${a.status}</span></span>${a.status=="open"?`<button onclick="cl(${a.id})">${T("close")}</button>`:""}</div>`).join("")}
async function cl(i){await api(`ads/${i}/close`,"POST");await load();post()}
async function orders(){const d=await api("orders");$("#v").innerHTML=d.orders.map(o=>`<div class="card row" onclick="go('order/${o.id}')" style="cursor:pointer"><span>#${o.id} ${o.amount} USDT @ ${o.price} ${E(o.fiat)}</span><span class=mu>${E(o.buyer)} → ${E(o.seller)}</span><span class="tag s-${o.status}">${o.status}</span></div>`).join("")||`<p class=mu>${T("none")}</p>`}
async function order(id){const d=await api("orders/"+id),o=d.order,b=d.me==o.buyer_id,s=d.me==o.seller_id;
const B=[];if(b&&o.status=="pending")B.push(`<button class=g onclick="ac('paid')">${T("paid")}</button><button onclick="ac('cancel')">${T("can")}</button>`);if(s&&o.status=="paid")B.push(`<button class=g onclick="ac('release')">${T("rel")}</button>`);if(o.status=="paid")B.push(`<button class=r onclick="ac('dispute')">${T("dis")}</button>`);
if(o.status=="completed"&&!d.rated)B.push(`<input id=sc type=number min=1 max=5 placeholder="${T("rate")}" style="max-width:120px"><button onclick="rt()">★</button>`);
$("#v").innerHTML=`<div class=card><div class=row><b>#${o.id} ${o.amount} USDT = ${(o.amount*o.price).toFixed(2)} ${E(o.fiat)}</b><span class="tag s-${o.status}">${o.status}</span></div><p class=mu>${E(o.buyer)} → ${E(o.seller)} · ${E(o.method)}</p><div class=row>${B.join("")}</div></div><div class=card id=ch>${d.messages.map(m=>`<div class="bub ${m.username==ME.user.username?"me":""}"><small>${E(m.username)}</small>${E(m.body)}</div>`).join("")}<div class=row><input id=cm placeholder="${T("msg")}" style="flex:1"><button class=p onclick="sd()">${T("send")}</button></div></div>`;
window.OID=id;timer=setInterval(async()=>{if(document.activeElement&&document.activeElement.id=="cm"&&$("#cm").value)return;if((location.hash.split("/")[0])=="#order")order(id)},6000)}
async function ac(a){let r=a=="dispute"?prompt("Reason")||"":"";await api(`orders/${OID}/${a}`,"POST",{reason:r});await load();order(OID)}
async function sd(){const v=$("#cm").value;if(!v)return;await api(`orders/${OID}/chat`,"POST",{body:v});order(OID)}
async function rt(){await api(`orders/${OID}/rate`,"POST",{score:$("#sc").value});order(OID)}
async function notes(){const d=await api("notifications");await load();nav();$("#v").innerHTML=d.notifications.map(n=>`<div class=card>${E(n.body)}<div class=mu>${new Date(n.created*1e3).toLocaleString()}</div></div>`).join("")||`<p class=mu>${T("none")}</p>`}
async function profile(){await load();const u=ME.user;$("#v").innerHTML=`<div class=card><h2><span class=av>${E(u.username[0]).toUpperCase()}</span>${E(u.username)} <span class=tag>${u.role}</span></h2><p class=mu>${T("bal")}</p><div class=bal>${u.balance} <small>USDT</small></div><p>★ ${ME.rating.avg} (${ME.rating.count})</p><button onclick="lo()">${T("out")}</button></div><h3>${T("led")}</h3>`+ME.ledger.map(l=>`<div class="card row"><span>${E(l.kind)}</span><b style="color:var(${l.amount>0?"--g":"--r"})">${l.amount}</b></div>`).join("")}
async function lo(){try{await api("logout","POST")}catch(e){}localStorage.removeItem("tok");ME=null;go("home")}
async function admin(){const d=await api("admin/overview");$("#v").innerHTML=`<div class=card>Users ${d.stats.users} · Orders ${d.stats.orders} · Open disputes ${d.stats.open_disputes}</div>`+d.disputes.map(x=>`<div class="card row"><span>Dispute #${x.id} order #${x.order_id} <span class=tag>${x.status}</span> ${E(x.reason)}</span>${x.status=="open"?`<span><button class=g onclick="rs(${x.id},'release')">${T("res")}</button> <button onclick="rs(${x.id},'refund')">${T("ref")}</button></span>`:""}</div>`).join("")+`<h3>Users</h3>`+d.users.map(x=>`<div class="card row"><span>${E(x.username)} (${x.role}) ${x.balance} ${x.banned?"🚫":""}</span><button onclick="bn(${x.id})">${T("ban")}</button></div>`).join("")+`<h3>Audit</h3>`+d.audit.map(x=>`<div class=mu>#${x.user_id} ${E(x.action)} ${E(x.detail)}</div>`).join("")}
async function rs(i,d){await api(`admin/disputes/${i}/resolve`,"POST",{decision:d});admin()}
async function bn(i){await api(`admin/users/${i}/ban`,"POST");admin()}
window.onhashchange=route;init();
</script></body></html>
